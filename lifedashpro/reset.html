<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>LifeDashPro Web Reset</title><style>html,body{margin:0;min-height:100%;background:#07111f;color:#eef5ff;font-family:Inter,system-ui,sans-serif}main{min-height:100vh;display:grid;place-content:center;padding:24px;text-align:center}section{max-width:520px;padding:24px;border:1px solid #29405f;border-radius:18px;background:#0e1c30}h1{margin:0 0 10px;font-size:22px}p{color:#9fb3ca;line-height:1.5}button{border:0;border-radius:12px;padding:11px 16px;background:linear-gradient(135deg,#2563eb,#6a38f5);color:#fff;font-weight:800;cursor:pointer}</style></head><body><main><section><h1>Refreshing LifeDashPro Web…</h1><p id="status">Removing only old LifeDashPro Web cache and service-worker files. Your account and synced data are not deleted.</p><button id="go" hidden>Continue</button></section></main><script>(async()=>{const s=document.getElementById('status'),b=document.getElementById('go');try{if('serviceWorker'in navigator){const regs=await navigator.serviceWorker.getRegistrations();await Promise.all(regs.filter(r=>r.scope.includes('/lifedashpro/')||r.scope.includes('/app/')).map(r=>r.unregister()))}if('caches'in window){const keys=await caches.keys();await Promise.all(keys.filter(k=>k.startsWith('lifedashpro-web-')).map(k=>caches.delete(k)))}s.textContent='Old web cache removed. Opening the clean LifeDashPro login…';setTimeout(()=>location.replace('/lifedashpro/?cacheReset=1'),700)}catch(e){s.textContent='Automatic refresh could not finish. Continue to LifeDashPro and refresh once.';b.hidden=false;b.onclick=()=>location.replace('/lifedashpro/?cacheReset=1')}})();</script></body></html>
