<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#070b14">
  <meta name="robots" content="noindex,follow">
  <title>LifeDashPro Web | MONSI AI</title>
  <meta name="description" content="Opening the current LifeDashPro Web workspace.">
  <link rel="icon" href="../assets/lifedash-icon.webp" type="image/webp">
  <meta http-equiv="refresh" content="0;url=../app/?workspace=desktop&v=13#dashboard">
  <style>
    *{box-sizing:border-box}html,body{margin:0;min-height:100%;background:#070b14;color:#f6f8ff;font-family:Inter,ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif}body{min-height:100vh;display:grid;place-items:center;background:radial-gradient(circle at 25% 20%,rgba(42,191,255,.13),transparent 30%),radial-gradient(circle at 76% 24%,rgba(123,86,255,.18),transparent 34%),#070b14}.card{width:min(92vw,470px);padding:30px;border:1px solid rgba(255,255,255,.11);border-radius:26px;background:linear-gradient(160deg,rgba(20,32,55,.86),rgba(8,15,27,.82));box-shadow:0 28px 90px rgba(0,0,0,.38);text-align:center;backdrop-filter:blur(18px)}img{width:76px;height:76px;border-radius:22px;box-shadow:0 16px 40px rgba(89,104,255,.28)}h1{margin:18px 0 8px;font-size:30px;letter-spacing:-.04em}p{margin:0;color:#9dafc7;line-height:1.6}.loader{width:38px;height:4px;margin:22px auto 0;border-radius:99px;background:linear-gradient(90deg,#4bd5ff,#706cff,#a56cff);box-shadow:0 0 24px rgba(98,108,255,.34)}a{display:inline-flex;margin-top:22px;padding:11px 15px;border:1px solid rgba(111,168,255,.25);border-radius:12px;color:#dceaff;text-decoration:none;background:rgba(111,168,255,.07);font-weight:750;font-size:13px}
  </style>
  <script>
    (()=>{
      const target=new URL('../app/',location.href);
      const source=new URLSearchParams(location.search);
      if(!source.has('workspace')) source.set('workspace','desktop');
      if(!source.has('v')) source.set('v','13');
      target.search=source.toString();
      target.hash=location.hash||'#dashboard';
      location.replace(target.href);
    })();
  </script>
</head>
<body>
  <main class="card">
    <img src="../assets/lifedash-icon.webp" alt="LifeDashPro">
    <h1>LifeDashPro Web</h1>
    <p>The previous public preview has been retired. Opening the current secure desktop workspace with user login.</p>
    <div class="loader" aria-hidden="true"></div>
    <a href="../app/?workspace=desktop&v=13#dashboard">Open LifeDashPro Web</a>
  </main>
</body>
</html>
