name: LifeDashPro NEXT Lossless GTFS 1-2-3 Day Preflight (NO WRITES)
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  forecast:
    strategy:
      fail-fast: false
      matrix:
        feed: [rail, bus, sofia]
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      FORECAST_FEED: ${{ matrix.feed }}
    steps:
      - name: Download GTFS to temporary GitHub runner
        shell: bash
        run: |
          set -euo pipefail
          case "$FORECAST_FEED" in
            rail) url='https://download.gtfs.de/germany/rv_free/latest.zip'; maximum=45000000 ;;
            bus) url='https://download.gtfs.de/germany/nv_free/latest.zip'; maximum=450000000 ;;
            sofia) url='https://gtfs.sofiatraffic.bg/api/v1/static'; maximum=80000000 ;;
            *) exit 2 ;;
          esac
          curl --fail --silent --show-error --location --retry 3 --connect-timeout 25 --max-time 1200 "$url" --output "$RUNNER_TEMP/feed.zip"
          bytes="$(stat -c %s "$RUNNER_TEMP/feed.zip")"
          echo "Source bytes: $bytes"
          test "$bytes" -gt 1000000
          test "$bytes" -lt "$maximum"
      - name: Read-only LOSSLESS 1-day, 2-day, 3-day footprint forecast
        shell: bash
        run: |
          python3 - <<'PY'
          import os,csv,io,re,math,json,zipfile,datetime,collections
          from zoneinfo import ZoneInfo
          from pathlib import Path
          feed=os.environ['FORECAST_FEED']
          tz=ZoneInfo('Europe/Sofia' if feed=='sofia' else 'Europe/Berlin')
          start=datetime.datetime.now(tz).date()
          dates=[start+datetime.timedelta(days=i) for i in range(3)]
          anchors=[(48.8089,11.7639),(49.0539,11.7844),(48.9973,11.8195),
            (48.962,11.683),(48.918,11.874),(48.895,11.656),(48.989,12.195),(53.0758,8.8072)]
          mode_map={'rail':{'2':'train','100':'train','101':'train','102':'train','103':'train','106':'train','107':'train','109':'train'},
                    'bus':{x:'bus' for x in ['3']+[str(i) for i in range(700,711)]},'sofia':{'0':'tram','1':'subway','3':'bus'}}[feed]
          def scope(lat,lon):
            if feed=='rail':return 47<=lat<=55.3 and 5<=lon<=16
            centers=[(42.6977,23.3219)] if feed=='sofia' else anchors
            radius=25000 if feed=='sofia' else 14500
            p=math.pi/180
            for a,b in centers:
              v=math.sin((lat-a)*p/2)**2+math.cos(lat*p)*math.cos(a*p)*math.sin((lon-b)*p/2)**2
              if 12742000*math.asin(math.sqrt(min(1,v)))<=radius:return True
            return False
          def dt8(s):return datetime.datetime.strptime(s,'%Y%m%d').date()
          def seconds(s):
            m=re.fullmatch(r'(\d{1,2}):(\d{2}):(\d{2})',s or '')
            if not m:return None
            h,mn,ss=map(int,m.groups())
            return h*3600+mn*60+ss if h<=47 and mn<=59 and ss<=59 else None
          with zipfile.ZipFile(Path(os.environ['RUNNER_TEMP'])/'feed.zip') as z:
            def records(filename):
              if filename not in z.namelist():return iter(())
              return csv.DictReader(io.TextIOWrapper(z.open(filename),encoding='utf-8-sig',newline=''))
            if {'stops.txt','routes.txt','trips.txt','stop_times.txt'}-set(z.namelist()):
              raise SystemExit('Missing a required GTFS file')
            active={d:set() for d in dates}
            for r in records('calendar.txt'):
              try:
                startdate,enddate=dt8(r['start_date']),dt8(r['end_date'])
                for d in dates:
                  if startdate<=d<=enddate and r.get(d.strftime('%A').lower())=='1':active[d].add(r['service_id'])
              except (KeyError,ValueError):pass
            for r in records('calendar_dates.txt'):
              try:
                d=dt8(r['date'])
                if d not in active:continue
                if r.get('exception_type')=='1':active[d].add(r['service_id'])
                elif r.get('exception_type')=='2':active[d].discard(r['service_id'])
              except (KeyError,ValueError):pass
            if not any(active.values()):raise SystemExit('No active GTFS service for the next 3 dates')
            stops={}
            for r in records('stops.txt'):
              try:
                lat,lon=float(r['stop_lat']),float(r['stop_lon'])
                if scope(lat,lon):stops[r['stop_id']]=(r['stop_name'],lat,lon,(r.get('platform_code') or '')[:30])
              except (ValueError,KeyError):pass
            routes={}
            for r in records('routes.txt'):
              mode=mode_map.get(r.get('route_type'))
              if mode is None:continue
              label=(r.get('route_short_name') or r.get('route_long_name') or 'Transit')[:40]
              if feed=='rail' and re.match(r'^S\s*\d',label,re.I):mode='suburban'
              routes[r['route_id']]=(label,mode)
            trips={}
            for r in records('trips.txt'):
              route=r.get('route_id')
              if route not in routes:continue
              days=[d for d in dates if r.get('service_id') in active[d]]
              if days:trips[r['trip_id']]=(route,(r.get('trip_headsign') or '')[:70],days)
            payload=collections.defaultdict(list)
            served=set();event_count=0;mode_counts=collections.Counter()
            limit=2000000 if feed=='rail' else 1200000
            for r in records('stop_times.txt'):
              trip=trips.get(r.get('trip_id'));sid=r.get('stop_id')
              if trip is None or sid not in stops or r.get('pickup_type')=='1':continue
              sec=seconds(r.get('departure_time') or r.get('arrival_time'))
              if sec is None:continue
              route,heading,days=trip;line,mode=routes[route]
              for day in days:
                at=datetime.datetime.combine(day,datetime.time(),tz)+datetime.timedelta(seconds=sec)
                if at.date() not in dates:continue
                event_count+=1;served.add(sid);mode_counts[mode]+=1
                if event_count>limit:raise SystemExit(f'MAX_DAY_EVENTS exceeded: {limit}')
                payload[(sid,at.date())].append([at.isoformat(),line,heading,r['trip_id'],mode,stops[sid][3]])
            # LOSSLESS: no 450-record clipping; explicitly report what the old importer would drop.
            per_day={day:{'events':0,'blocks':0,'bytes':0,'would_clip_450':0,'max_one_stop_day':0} for day in dates}
            for (sid,day),items in payload.items():
              items.sort(key=lambda x:x[0])
              n=len(items);stats=per_day[day]
              stats['events']+=n
              stats['blocks']+=1
              stats['would_clip_450']+=max(0,n-450)
              stats['max_one_stop_day']=max(stats['max_one_stop_day'],n)
              stats['bytes']+=len(json.dumps(items,ensure_ascii=False,separators=(',',':')).encode())
            max_mib=65 if feed=='rail' else 55
            scenarios={}
            for day_count in [1,2,3]:
              chosen=dates[:day_count]
              size_mib=sum(per_day[day]['bytes'] for day in chosen)/1048576
              scenario={
                'events_full':sum(per_day[day]['events'] for day in chosen),
                'payload_blocks':sum(per_day[day]['blocks'] for day in chosen),
                'lossless_json_mib':round(size_mib,2),
                'would_drop_at_old_450_cap':sum(per_day[day]['would_clip_450'] for day in chosen),
                'max_records_at_one_stop_in_one_day':max(per_day[day]['max_one_stop_day'] for day in chosen),
                'under_old_json_cap':size_mib<=max_mib,
                'estimated_db_single_slot_mib_from_201_22_baseline':round(201.22+2.6*size_mib,2),
                'estimated_db_two_slots_mib_from_201_22_baseline':round(201.22+5.2*size_mib,2),
                'not_actual_postgres_size':True
              }
              scenarios[str(day_count)+'_day']=scenario
            data={'feed':feed,'mode':'READ_ONLY_LOSSLESS','source_zip_mib':round((Path(os.environ['RUNNER_TEMP'])/'feed.zip').stat().st_size/1048576,2),
              'dates':[str(d) for d in dates],
              'scoped_stop_count':len(stops),'served_stop_count':len(served),
              'matched_route_count_whole_feed':len(routes),'active_trip_count_whole_feed':len(trips),
              'mode_counts':dict(mode_counts),'old_importer_cap_mib':max_mib,
              'one_two_three_day_scenarios':scenarios,
              'note':'Only GTFS payload estimate; A/B and PostgreSQL sizes are not measured. No writes or secrets. No 450 truncation performed.'}
            print(json.dumps(data,ensure_ascii=False,indent=2))
            with open(os.environ['GITHUB_STEP_SUMMARY'],'a',encoding='utf-8') as f:
              f.write('## '+feed+' GTFS - LOSSLESS 1/2/3-day forecast - READ ONLY\n\n')
              f.write('- Region scoped stops: '+str(len(stops))+'; served: '+str(len(served))+'\n')
              f.write('- Original per-stop/day cap: 450 (NOT applied to JSON here)\n')
              for name,v in scenarios.items():
                f.write('- **'+name+'**: '+str(v['events_full'])+' departures; '+str(v['lossless_json_mib'])+
                  ' MiB JSON; '+str(v['would_drop_at_old_450_cap'])+' would be lost at 450; '+
                  'old size cap OK='+str(v['under_old_json_cap'])+
                  '; rough double-slot total='+str(v['estimated_db_two_slots_mib_from_201_22_baseline'])+' MiB\n')
              f.write('\n**No Supabase access, no writes. Database sizes are estimates, not measurements.**\n')
          PY
