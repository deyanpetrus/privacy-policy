name: LifeDashPro NEXT - Free-tier Sofia and German regional rail compact cache
on:
  push:
    branches: [main]
    paths:
      - 'lifedashpro/transit/next_compact_slot_refresh.py'
      - '.github/workflows/lifedashpro-next-compact-slots.yml'
  schedule:
    - cron: '15 5 * * *'
  workflow_dispatch:
    inputs:
      mode:
        description: "plan = read-only source audit, refresh = guarded import"
        type: choice
        required: true
        default: plan
        options: [plan, refresh]
permissions:
  contents: read
concurrency:
  group: lifedashpro-dedicated-transit-import
  cancel-in-progress: false
jobs:
  compact_sources:
    runs-on: ubuntu-latest
    timeout-minutes: 65
    env:
      LDP_DEDICATED_TRANSIT_DB_URL: ${{ secrets.LDP_DEDICATED_TRANSIT_DB_URL }}
      PYTHONUNBUFFERED: '1'
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Install pinned PostgreSQL client
        run: python -m pip install --disable-pip-version-check 'psycopg[binary]==3.2.10'
      - name: Compile and enforce NEW Transit only
        shell: bash
        run: |
          set -euo pipefail
          python -m py_compile lifedashpro/transit/next_compact_slot_refresh.py
          python - <<'PY'
          from pathlib import Path
          text=Path("lifedashpro/transit/next_compact_slot_refresh.py").read_text()
          for required in ("verify_target(url)", "gnqtngtuzbxohgwgvmpb",
                           "pg_try_advisory_xact_lock(820617,20261017)",
                           "MAX_DB_BYTES = 390", "pg_database_size(current_database())",
                           "active_slot", "SOURCE_VERIFIED", "SAFE_IMPORT_STOP",
                           "transit_next.", "MAX_PAYLOAD_BYTES"):
              assert required in text, required
          assert "djbxhyhqefylyqqlifan" not in text
          print("NEXT_COMPACT_STATIC_GUARDS_PASS")
          PY
      - name: Choose safe mode
        id: mode
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          INPUT_MODE: ${{ inputs.mode }}
        run: |
          if [[ "$EVENT_NAME" == "workflow_dispatch" && "$INPUT_MODE" == "plan" ]]; then
            echo "mode=plan" >> "$GITHUB_OUTPUT"
          else
            echo "mode=refresh" >> "$GITHUB_OUTPUT"
          fi
      - name: Verify and (if authorized) import official Sofia schedule
        shell: bash
        run: |
          set -euo pipefail
          python lifedashpro/transit/next_compact_slot_refresh.py \
            --feed sofia --mode "${{ steps.mode.outputs.mode }}" \
            --confirm-project-ref gnqtngtuzbxohgwgvmpb
      - name: Verify and (if authorized) import official regional rail subset
        shell: bash
        run: |
          set -euo pipefail
          python lifedashpro/transit/next_compact_slot_refresh.py \
            --feed rail --mode "${{ steps.mode.outputs.mode }}" \
            --confirm-project-ref gnqtngtuzbxohgwgvmpb
      - name: Summary
        if: always()
        shell: bash
        run: |
          echo "## NEXT Transit compact Sofia/rail" >> "$GITHUB_STEP_SUMMARY"
          echo "Run mode: ${{ steps.mode.outputs.mode }}; isolated project only." >> "$GITHUB_STEP_SUMMARY"
          echo "Import is transactional per feed, A/B slot atomic, capped at 390 MiB database." >> "$GITHUB_STEP_SUMMARY"
          echo "Existing de-national GTFS and original LifeDashPro project are untouched." >> "$GITHUB_STEP_SUMMARY"
